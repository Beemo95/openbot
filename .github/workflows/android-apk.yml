name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CI: "1"
      EXPO_PUBLIC_APP_ENV: preview
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h "$GITHUB_WORKSPACE"

      - name: Set up Bun and Node
        uses: ./.github/actions/setup-bun
        with:
          install: none

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure build memory
        run: |
          mkdir -p ~/.gradle
          echo 'org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=2g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8' >> ~/.gradle/gradle.properties
          echo 'org.gradle.workers.max=2' >> ~/.gradle/gradle.properties
          sudo fallocate -l 8G /swapfile-build
          sudo chmod 600 /swapfile-build
          sudo mkswap /swapfile-build
          sudo swapon /swapfile-build

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build APK
        working-directory: apps/mobile
        run: |
          bunx expo prebuild --platform android --no-install --non-interactive
          cd android
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a -Pexpo.useLegacyPackaging=true
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/openbot.apk"

      - name: Save APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openbot-android-apk
          path: ${{ runner.temp }}/openbot.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: android-apk-${{ github.run_id }}-${{ github.run_attempt }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/openbot.apk" \
            --target "$RELEASE_COMMIT" \
            --title "Android APK $RELEASE_TAG" \
            --notes "Test APK built from commit $RELEASE_COMMIT." \
            --prerelease
